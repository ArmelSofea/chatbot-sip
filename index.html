<style>
  :root{
    --bg:#eef2f0; --ink:#15231d; --muted:#5d6b65;
    --brand:#0f5c46; --brand-2:#13795b; --bot:#ffffff; --me:#d9f2e6;
    --chip:#ffffff; --chip-ink:#0f5c46; --wa:#1fa855; --line:#dfe6e2; --accent:#f28c28;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  .app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;position:relative}
  .avatar{overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:15px}
  .who span{font-size:12px;opacity:.85}
  .who b span{font-size:inherit;opacity:1}
  .progress{height:4px;background:rgba(255,255,255,.15)}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  #chat{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.05);animation:pop .18s ease-out}
  .bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
  .me{background:var(--me);align-self:flex-end;border-bottom-right-radius:4px}
  .msg b,.msg strong{font-weight:inherit}
  .msg b.hl{font-weight:700}
  .msg ul{margin:6px 0 2px;padding-left:18px}
  .msg li{margin:2px 0}
  .msg .note{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
  .btn{display:inline-block;margin-top:8px;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 14px;border-radius:10px;text-align:center}
  .btn.wa{background:var(--wa)}
  .btn.portal{background:#1f4fa8}
  .chips{display:flex;flex-direction:column;gap:6px;align-self:flex-end;max-width:88%;width:100%;align-items:flex-end}
  .chips.row{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
  .chip{border:1.5px solid var(--brand-2);background:var(--chip);color:var(--chip-ink);font:inherit;font-size:13.5px;font-weight:600;padding:9px 13px;border-radius:14px;cursor:pointer;text-align:right}
  .chip:active{transform:scale(.97)}
  .chip.ghost{border-color:#cfd8d4;color:var(--muted);font-weight:500}
  .restart{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font:inherit;font-size:12px;font-weight:600;padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .typing{display:flex;gap:4px;padding:12px 14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#9aa8a2;animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  form.hidden{display:none}
  form{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line)}
  input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font:inherit;font-size:15px;background:#fff;outline:none}
  input:focus{border-color:var(--brand-2)}
  button.send{border:0;background:var(--brand);color:#fff;border-radius:50%;width:46px;height:46px;font-size:18px;cursor:pointer;flex:none}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:0 12px 10px}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>

      frame.name = "jfFrame"; frame.id = "jfFrame"; frame.style.display = "none";

    }
    const f = document.createElement("form");
    f.method = "POST"; f.action = "https://submit.jotform.com/submit/" + JOTFORM.id;
    f.target = "jfFrame"; f.acceptCharset = "utf-8"; f.style.display = "none";
    const add = (n, v) => { const i = document.createElement("input"); i.type = "hidden"; i.name = n; i.value = v; f.appendChild(i); };
    add("formID", JOTFORM.id);
    add("simple_spc", JOTFORM.id + "-" + JOTFORM.id);
    add("website", "");
    add("submitSource", "chatbot");
    for(const [k, name] of Object.entries(JOTFORM.fields)){ if(state.ans[k]) add(name, state.ans[k]); }
    add(JOTFORM.status, state.failed ? "TIDAK LAYAK" : "LAYAK");
    document.body.appendChild(f);
    f.submit();
    setTimeout(() => f.remove(), 3000);
    return true;
  }catch(e){ return false; }
}

const chat = document.getElementById("chat");
const form = document.getElementById("f");
const input = document.getElementById("q");
const bar = document.getElementById("bar");
let state = { step:null, ans:{}, failed:false, done:false };
let runId = 0;
let LANG = "ms";
const T = (ms, en) => LANG === "en" ? en : ms;
const OT = o => (LANG === "en" && o.te) ? o.te : o.t;
window.addEventListener("unhandledrejection", e => { if(e.reason && e.reason.message === "restarted") e.preventDefault(); });

const sleep = ms => new Promise(r => setTimeout(r, ms));
function norm(s){ return " " + s.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\bbrp\b/g,"berapa").replace(/\s+/g," ").trim() + " "; }
function scroll(){ chat.scrollTop = chat.scrollHeight; }
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function addMe(text){
  const d = document.createElement("div"); d.className = "msg me"; d.textContent = text;
  chat.appendChild(d); scroll();
}
async function say(html){
  const myRun = runId;
  const d = document.createElement("div"); d.className = "msg bot";
  d.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>'; d.style.padding = "0";
  chat.appendChild(d); scroll();
  await sleep(Math.min(1400, 500 + html.replace(/<[^>]+>/g,"").length * 12));
  if(myRun !== runId) throw new Error("restarted");   // hentikan aliran lama
  d.style.padding = ""; d.innerHTML = html; scroll();
}
function clearChips(){ document.querySelectorAll(".chips").forEach(c => c.remove()); }
function chips(list, row){
  clearChips();
  const w = document.createElement("div"); w.className = "chips" + (row ? " row" : "");
  list.forEach(o => {
    const b = document.createElement("button"); b.type = "button";
    b.className = "chip" + (o.ghost ? " ghost" : ""); b.textContent = o.t;
    b.onclick = () => { clearChips(); o.fn(); };
    w.appendChild(b);
  });
  chat.appendChild(w); scroll();
}
function setBar(n){ bar.style.width = Math.round((n / TOTAL) * 100) + "%"; }

/* ---------- Aliran soalan ---------- */
async function goStep(key){
  if(key === "END" || (state.failed && key === "kursus")) return finish();
  state.step = key;
  const s = STEPS[key];
  setBar(s.no - 1);
  for(const line of askOf(s)) await say(line.replace(/\{nama\}/g, esc(state.ans.nama || "")));
  if(s.text){ form.classList.remove("hidden"); input.placeholder = T(s.ph, s.phEn) || "..."; input.focus(); return; }
  showOptions(key);
}
function askOf(s){ const d = s.askFn && s.askFn(); if(d) return d; return (LANG === "en" && s.askEn) ? s.askEn : s.ask; }
function showOptions(key){
  const s = STEPS[key];
  chips(s.opts.map(o => ({ t:OT(o), fn:() => pick(key, o) })));
}
async function pick(key, o){
  addMe(OT(o));
  state.ans[key] = o.v;
  afterPick(key, o);
}
async function afterPick(key, o){
  const s = STEPS[key];
  if(o.fail) state.failed = true;   // tak layak: teruskan soalan asas, tapi tiada kursus/nama/telefon
  const rx = (LANG === "en" && s.reactEn) ? s.reactEn : s.react;
  if(rx && rx[o.v]) await say(rx[o.v]);
  goStep(o.next);
}

/* ---------- Penamat (prospek tak nampak status) ---------- */
async function finish(){
  state.step = null; state.done = true; setBar(TOTAL);
  input.placeholder = T("Taip soalan...","Type a question...");
  const nama = state.ans.nama || "";

  if(!state.failed){
    if(!state.sent){ state.sent = sendToJotform(); if(state.sent) track("Lead"); }
    await say(T(`Terima kasih ${esc(nama)}! 🙏<br>Saya akan WhatsApp dalam tempoh terdekat. Mungkin hari ni juga untuk proses seterusnya.`,
                `Thank you ${esc(nama)}! 🙏<br>I will WhatsApp you shortly, possibly today, for the next steps.`));
    await say(T(`Nak cepat? Boleh terus WhatsApp saya sekarang 😊`, `In a hurry? You can WhatsApp me right now 😊`) +
      `<br><a class="btn wa" id="waSend" href="${waLink(true)}" target="_blank" rel="noopener">💬 ${T("WhatsApp sekarang","WhatsApp now")}</a>`);
    document.getElementById("waSend").addEventListener("click", () => track("Contact"));
    chips([{ t:T("↻ Isi semula","↻ Start over"), ghost:true, fn:restart }], true);
  } else {
    if(CONFIG.simpanTakLayak && !state.sent) state.sent = sendToJotform();
    await say(T(`Terima kasih kerana meluangkan masa menjawab 🙏`, `Thank you for taking the time to answer 🙏`));
    await say(T(`Berdasarkan situasi anda, cara paling tepat ialah <b>mohon terus melalui Portal LINDUNG Kerjaya PERKESO</b>. Di sana anda boleh lihat manfaat dan program yang sesuai dengan rekod caruman anda.`,
                `Based on your situation, the best way is to <b>apply directly through the PERKESO LINDUNG Kerjaya Portal</b>. There you can see the benefits and programmes that suit your contribution record.`) +
      `<br><a class="btn portal" id="portalBtn" href="${CONFIG.portalUrl}" target="_blank" rel="noopener">🔗 ${T("Buka Portal LINDUNG Kerjaya","Open LINDUNG Kerjaya Portal")}</a>`);
    document.getElementById("portalBtn").addEventListener("click", () => track("ViewContent"));
    await say(T(`Semoga dipermudahkan urusan anda 🙏`, `Wishing you all the best 🙏`));
    chips([{ t:T("↻ Isi semula","↻ Start over"), ghost:true, fn:restart }], true);
  }
}

function waLink(ok){
  const a = state.ans;
  const L = k => a[k] ? `${STEPS[k].label}: ${a[k]}\n` : "";
  let msg;
  if(ok){
    msg = `Hai, saya nak daftar Program Latihan SIP.\n\n` +
      (LANG === "en" ? "Bahasa: English\n" : "") + L("nama") + L("telefon") + L("punca") + L("sebab") + L("kontrak") + L("tahun") + L("carum") + L("emp") + L("hadir") + L("kursus") +
      `\nRef: ${CONFIG.kodLayak}`;
  } else {
    msg = `Hai, saya ada soalan tentang Program Latihan SIP.\n\n` +
      L("nama") + L("punca") + L("sebab") + L("kontrak") + L("tahun") + L("carum") + L("emp") + L("hadir") +
      `\nRef: ${CONFIG.kodTidak}`;
  }
  return `https://wa.me/${CONFIG.waNumber}?text=${encodeURIComponent(msg)}`;
}
function track(ev){ try{ if(typeof fbq === "function") fbq("track", ev); }catch(e){} }

/* ---------- Taip sendiri ---------- */
const SLANG = [[/\bbrp\b/g,"berapa"],[/\bmcm\b/g,"macam"],[/\bnk\b/g,"nak"],[/\bdpt\b/g,"dapat"],
  [/\byg\b/g,"yang"],[/\bkne\b/g,"kena"],[/\bkat\b/g,"kat"],[/\btkde\b/g,"takde"],[/\bxde\b/g,"takde"],
  [/\bxda\b/g,"takde"],[/\bxpe\b/g,"tak apa"],[/\bsy\b/g,"saya"],[/\bcmne\b/g,"macam mana"],[/\bcamne\b/g,"macam mana"],
  [/\bmacamana\b/g,"macam mana"],[/\bblh\b/g,"boleh"],[/\bbole\b/g,"boleh"],[/\bklu\b/g,"kalau"],[/\bkalu\b/g,"kalau"],
  [/\bpstu\b/g,"lepas tu"],[/\bsijl\b/g,"sijil"],[/\bkursu\b/g,"kursus"],[/\bperkeso\b/g,"perkeso"]];
function normT(s){
  let t = " " + s.toLowerCase().replace(/[^a-z0-9\s]/g," ") + " ";
  for(const [r,v] of SLANG) t = t.replace(r, v);
  return t.replace(/\s+/g," ");
}
function hits(t, keys){
  let s = 0;
  for(const k of keys){
    const nk = normT(k).trim(); if(!nk) continue;
    if(t.includes(" " + nk + " ")) s += nk.split(" ").length * 2;
    else if(nk.length >= 5 && t.includes(nk)) s += 1;
  }
  return s;
}
function faqAnswer(text){
  const t = normT(text); let best = null, sc = 0;
  for(const f of FAQ){ const s = hits(t, f.k); if(s > sc){ sc = s; best = f; } }
  return sc >= 2 ? best : null;
}
const Q_WORDS = /^(apa|apakah|berapa|bila|bilakah|macam mana|bagaimana|boleh|ada|adakah|kenapa|mengapa|siapa|mana|kalau|perlu|kena|nak tanya|saya nak tanya|what|how|when|where|why|who|which|can|is|are|do|does|will|should)\b/;
function looksLikeQuestion(text){
  const t = normT(text).trim();
  return /\?/.test(text) || Q_WORDS.test(t);
}
function matchOption(key, text){
  const keys = OPTKEYS[key]; if(!keys) return null;
  const t = normT(text); let best = -1, sc = 0, tie = false;
  keys.forEach((ks, i) => { const s = hits(t, ks); if(s > sc){ sc = s; best = i; tie = false; } else if(s && s === sc){ tie = true; } });
  return (sc >= 2 && !tie) ? STEPS[key].opts[best] : null;
}
async function answerFaq(text){
  const f = faqAnswer(text);
  if(f){
    await say(T(f.a, f.e || f.a) + (f.wa ? `<br><a class="btn wa" href="${waLink(!state.failed)}" target="_blank" rel="noopener" onclick="track('Contact')">💬 ${T("WhatsApp pegawai kami","WhatsApp our officer")}</a>` : ""));
  } else {
    await say(T(`Soalan yang bagus. Yang ini pegawai kami akan terangkan lebih lanjut melalui WhatsApp ya.`, `Good question. Our officer will explain this further via WhatsApp.`));
  }
}

form.addEventListener("submit", e => { e.preventDefault(); handleSend(); });
document.getElementById("sendBtn").addEventListener("click", () => handleSend());
input.addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); handleSend(); } });
let sending = false;
async function handleSend(){
  if(sending) return;
  const v = input.value.trim(); if(!v) return;
  sending = true;
  try{ await processInput(v); } finally { sending = false; input.focus(); }
}
async function processInput(v){
  input.value = "";
  addMe(v);

  // Langkah nama
  if(state.step === "nama"){
    if(looksLikeQuestion(v) || faqAnswer(v) && v.split(" ").length > 3){
      await answerFaq(v);
      await say(T(`Boleh saya dapatkan nama anda untuk teruskan?`, `May I have your name to continue?`));
      return;
    }
    if(v.length < 2 || /\d/.test(v)){ await say(T(`Maaf, boleh taip nama anda ya? Contoh: Ahmad`, `Sorry, could you type your name? Example: Ahmad`)); return; }
    state.ans.nama = v.replace(/\s+/g," ");
    return goStep("telefon");
  }

  // Langkah telefon
  if(state.step === "telefon"){
    let d = v.replace(/[^0-9]/g,"");
    if(d.startsWith("60")) d = "0" + d.slice(2);
    if(/[a-z]/i.test(v) && d.length < 9){
      await answerFaq(v);
      await say(T(`Boleh saya dapatkan <b>no. telefon (WhatsApp)</b> anda untuk teruskan?`, `May I have your <b>phone number (WhatsApp)</b> to continue?`));
      return;
    }
    if(!/^01\d{8,9}$/.test(d)){ await say(T(`Hmm, nombor tu macam tak lengkap. Boleh taip semula? Contoh: 0123456789`, `Hmm, that number looks incomplete. Could you retype it? Example: 0123456789`)); return; }
    state.ans.telefon = d;
    input.placeholder = T("Taip soalan...","Type a question...");
    return goStep("setuju");
  }

  // Sedang jawab soalan pilihan: cuba faham jawapan yang ditaip
  if(state.step){
    if(!looksLikeQuestion(v)){
      const o = matchOption(state.step, v);
      if(o){ clearChips(); state.ans[state.step] = o.v; await say(`Noted: <b>${esc(OT(o))}</b> 👍`); return afterPick(state.step, o); }
    }
    await answerFaq(v);
    await say(T(`Jom sambung 😊`, `Let's continue 😊`));
    for(const line of askOf(STEPS[state.step]).slice(-1)) await say(line);
    showOptions(state.step);
    return;
  }

  // Belum mula / dah selesai
  await answerFaq(v);
  if(!state.done){
    await say(T(`Kalau dah jelas, jom saya semak kesesuaian anda untuk program ni 😊`, `If that's clear, let me check your suitability for this programme 😊`));
    goChip();
  }
}

/* ---------- Mula ---------- */
function goChip(){
  const lbl = T("Jom mula 👍","Let's start 👍");
  chips([{ t:lbl, fn:() => { addMe(lbl); goStep("punca"); } }], true);
}
function startChips(){ goChip(); }

function restart(){
  runId++;
  chat.innerHTML = "";
  state = { step:null, ans:{}, failed:false, done:false };
  LANG = "ms"; applyLangUI();
  input.value = "";
  form.classList.add("hidden");
  setBar(0);
  intro();
}
document.getElementById("restartTop").addEventListener("click", restart);

function applyLangUI(){
  document.documentElement.lang = LANG === "en" ? "en" : "ms";
  document.getElementById("restartTop").textContent = T("↻ Isi semula","↻ Start over");
  document.getElementById("hdrRole").textContent = T("Penyelaras Program","Programme Coordinator");
  document.querySelector(".foot").textContent = T("Malaysian Institute of TVET Educators (MITE) · Penyedia Latihan Berdaftar SIP","Malaysian Institute of TVET Educators (MITE) · Registered SIP Training Provider");
  input.placeholder = T("Taip mesej...","Type a message...");
}
async function intro(){
  await say(`Assalamualaikum & hi! 👋<br>Sila pilih bahasa / Please choose your language:`);
  chips([
    { t:"🇲🇾 Bahasa Melayu", fn:() => { LANG = "ms"; applyLangUI(); addMe("🇲🇾 Bahasa Melayu"); introLang(); } },
    { t:"🇬🇧 English", fn:() => { LANG = "en"; applyLangUI(); addMe("🇬🇧 English"); introLang(); } }
  ], true);
}
async function introLang(){
  await say(T(`Terima kasih! Saya <b>Aizuddin</b>, penyelaras program SIP untuk <b>Malaysian Institute of TVET Educators (MITE)</b>.`,
              `Thank you! I'm <b>Aizuddin</b>, SIP programme coordinator for the <b>Malaysian Institute of TVET Educators (MITE)</b>.`));
  await say(T(`Untuk tujuan permohonan, saya nak tanya beberapa soalan berkaitan untuk tengok kesesuaian bagi program SIP ni. Boleh klik butang <b class="hl">Jom mula</b> di bawah 👇`,
              `For your application, I'll ask a few related questions to see your suitability for this SIP programme. Please click the <b class="hl">Let's start</b> button below 👇`));
  startChips();
}
intro();
</script>
